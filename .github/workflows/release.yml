name: ZShield CI/CD Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze
      - name: Run tests
        run: flutter test

  build_android:
    name: Build Android
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zshield-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows:
    name: Build Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows
      - name: Package Windows
        shell: pwsh
        run: |
          $VERSION = if ($env:GITHUB_REF -match "refs/tags/(v.*)") { $Matches[1] } else { "latest" }
          Compress-Archive -Path build\windows\runner\Release\* -DestinationPath "ZShield-$VERSION-Windows-x64.zip"
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: zshield-windows
          path: "*.zip"

  build_linux:
    name: Build Linux
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux
      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../ZShield-Linux-x64.tar.gz .
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: zshield-linux
          path: "*.tar.gz"

  build_macos:
    name: Build macOS
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build macOS
        run: flutter build macos
      - name: Package macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../ZShield-macOS-x64.zip ZShield.app
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: zshield-macos
          path: "*.zip"

  create_release:
    name: Create Release
    needs: [build_android, build_windows, build_linux, build_macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Rename Android APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv artifacts/app-release.apk artifacts/ZShield-$VERSION-Android.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
